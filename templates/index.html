<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <h1>AI Resume Analyzer & Improver</h1>
        <p>Get instant analysis, then enter a target job to receive personalized improvement suggestions.</p>

        <!-- --- STEP 1: UPLOAD FORM --- -->
        <form id="upload-form">
            <div class="file-input-wrapper">
                <button type="button" class="btn-file-dummy">Choose Resume PDF</button>
                <input type="file" id="resume-file" name="resume" accept=".pdf" required>
                <span id="file-name-display">No file selected</span>
            </div>
            <button type="submit" class="btn-submit">Step 1: Analyze Resume (Fast)</button>
        </form>

        <div id="loader-extract" class="loader hidden"></div>
        <div id="error-display-extract" class="error-box hidden"></div>

        <!-- --- RESULTS FOR STEP 1 --- -->
        <div id="results-extract" class="results-box hidden">
            <h2>Extracted Data (from Flash)</h2>
            <pre><code id="json-output-extract" class="language-json"></code></pre>
        </div>

        <!-- --- STEP 2: IMPROVER SECTION (Starts hidden) --- -->
        <div id="improver-section" class="hidden" style="margin-top: 2rem; border-top: 2px solid #4a5568; padding-top: 2rem;">
            <h2>Step 2: Get Improvement Suggestions</h2>
            <div class="text-input-wrapper" style="margin-bottom: 1.5rem;">
                <label for="target-job">Target Job Profile:</label>
                <input type="text" id="target-job" name="target_job" placeholder="e.g., Machine Learning Engineer" required>
            </div>
            <button id="btn-get-suggestions" class="btn-submit">Step 2: Get Feedback (Pro)</button>
            
            <div id="loader-suggest" class="loader hidden"></div>
            <div id="error-display-suggest" class="error-box hidden"></div>

            <!-- --- RESULTS FOR STEP 2 --- -->
            <div id="results-suggest" class="results-box hidden">
                <h2>Improvement Suggestions (from Pro)</h2>
                <pre><code id="json-output-suggest" class="language-json"></code></pre>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script>
        // --- Get all elements ---
        const uploadForm = document.getElementById('upload-form');
        const resumeFile = document.getElementById('resume-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const fileDummyBtn = document.querySelector('.btn-file-dummy');

        const loaderExtract = document.getElementById('loader-extract');
        const errorExtract = document.getElementById('error-display-extract');
        const resultsExtract = document.getElementById('results-extract');
        const jsonOutputExtract = document.getElementById('json-output-extract');

        const improverSection = document.getElementById('improver-section');
        const targetJobInput = document.getElementById('target-job');
        const btnGetSuggestions = document.getElementById('btn-get-suggestions');
        
        const loaderSuggest = document.getElementById('loader-suggest');
        const errorSuggest = document.getElementById('error-display-suggest');
        const resultsSuggest = document.getElementById('results-suggest');
        const jsonOutputSuggest = document.getElementById('json-output-suggest');

        // --- Store extracted data globally ---
        let extractedDataCache = null;

        // --- Event listener for dummy file button ---
        fileDummyBtn.addEventListener('click', () => resumeFile.click());

        // --- Event listener to show selected file name ---
        resumeFile.addEventListener('change', () => {
            fileNameDisplay.textContent = resumeFile.files.length > 0 ? resumeFile.files[0].name : 'No file selected';
        });

        // --- Event listener for STEP 1: Form submission (Fast Extraction) ---
        uploadForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            resultsExtract.classList.add('hidden');
            errorExtract.classList.add('hidden');
            improverSection.classList.add('hidden'); // Hide step 2 on new upload
            resultsSuggest.classList.add('hidden'); // Hide old suggestions
            loaderExtract.classList.remove('hidden');

            const formData = new FormData();
            formData.append('resume', resumeFile.files[0]);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'An unknown error occurred.');

                // Save data to cache
                extractedDataCache = data;

                // Display extracted data
                jsonOutputExtract.textContent = JSON.stringify(data, null, 2);
                Prism.highlightElement(jsonOutputExtract);
                resultsExtract.classList.remove('hidden');
                
                // Show the next step
                improverSection.classList.remove('hidden');

            } catch (error) {
                errorExtract.textContent = `Error: ${error.message}`;
                errorExtract.classList.remove('hidden');
            } finally {
                loaderExtract.classList.add('hidden');
            }
        });

        // --- Event listener for STEP 2: Get Suggestions (Pro Analysis) ---
        btnGetSuggestions.addEventListener('click', async () => {
            const targetJob = targetJobInput.value;
            
            if (!targetJob || !targetJob.trim()) {
                errorSuggest.textContent = "Please enter a target job profile.";
                errorSuggest.classList.remove('hidden');
                return;
            }
            if (!extractedDataCache) {
                errorSuggest.textContent = "Please analyze a resume first.";
                errorSuggest.classList.remove('hidden');
                return;
            }

            resultsSuggest.classList.add('hidden');
            errorSuggest.classList.add('hidden');
            loaderSuggest.classList.remove('hidden');

            // --- This is the payload structure you tested in Postman ---
            const payload = {
                extracted_data: extractedDataCache,
                target_job: targetJob
            };

            try {
                const response = await fetch('/suggest-improvements', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Send as JSON
                    },
                    body: JSON.stringify(payload) // Stringify the JSON payload
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'An unknown error occurred.');

                // Display suggestions
                jsonOutputSuggest.textContent = JSON.stringify(data, null, 2);
                Prism.highlightElement(jsonOutputSuggest);
                resultsSuggest.classList.remove('hidden');

            } catch (error) {
                errorSuggest.textContent = `Error: ${error.message}`;
                errorSuggest.classList.remove('hidden');
            } finally {
                loaderSuggest.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
